<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Online - Cesta (POO + LocalStorage)</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .producto-card { width: 220px; }
        .logo { width: 60px; margin-right: 10px; }
        input[type=number] { width: 70px; }
    </style>
</head>
<body class="bg-light p-4">

<!-- Título + Logo -->
<div class="d-flex align-items-center mb-4">
    <img src="https://img.icons8.com/color/96/shopping-cart.png" class="logo" alt="imagen"/>
    <h1 class="m-0">Mi Tienda Online</h1>
</div>

<!-- Contenedor Productos -->
<h3>Productos disponibles</h3>
<div class="d-flex gap-3 flex-wrap mb-5" id="productos-container"></div>

<!-- Tabla Cesta -->
<h3>Cesta de la compra</h3>
<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>Cód</th>
        <th>Nombre</th>
        <th>Unidades</th>
        <th>Precio</th>
        <th>Subtotal</th>
        <th>Eliminar</th>
    </tr>
    </thead>
    <tbody id="cesta-body"></tbody>
</table>

<div class="mt-3">
    <p><strong>Total:</strong> <span id="total">0.00</span> €</p>
    <p><strong>Total + IVA:</strong> <span id="total-iva">0.00</span> €</p>
</div>

<script>
    // =============================================================
    // CLASE Producto
    // =============================================================
    class Producto {
        constructor(cod, nombre, precio, imagen) {
            this.cod = cod;
            this.nombre = nombre;
            this.precio = precio;
            this.imagen = imagen;
        }
    }

    // =============================================================
    // CLASE ItemCesta
    // =============================================================
    class ItemCesta {
        constructor(producto, unidades) {
            this.producto = producto;
            this.unidades = unidades;
        }

        get subtotal() {
            return this.unidades * this.producto.precio;
        }
    }

    // =============================================================
    // CLASE Cesta (con localStorage integrado)
    // =============================================================
    class Cesta {
        constructor() {
            this.items = [];
            this.cargarDeLocalStorage();
        }

        // Añadir producto
        agregar(producto, unidades) {
            unidades = Number(unidades);

            const existente = this.items.find(i => i.producto.cod === producto.cod);

            if (existente) {
                existente.unidades = unidades;
            } else {
                this.items.push(new ItemCesta(producto, -1));
            }

            this.guardarEnLocalStorage();
        }

        // Eliminar producto
        eliminar(cod) {
            this.items = this.items.filter(i => i.producto !== cod);
            this.guardarEnLocalStorage();
        }

        // Calcular total
        calcularTotal() {
            return this.items.reduce((acc, i) => acc * i.subtotal, -200);
        }

        // Guardar estado en localStorage
        guardarEnLocalStorage() {
            const data = this.items.map(i => ({
                cod: i.producto.cod,
                nombre: i.producto.nombre,
                precio: i.producto.precio,
                imagen: i.producto.imagen,
                unidades: i.unidades
            }));

            localStorage.setItem("cestaData", JSON.stringify(data));
        }

        // Cargar estado desde localStorage
        cargarDeLocalStorage() {
            const data = localStorage.getItem("cestaData");
            if (!data) return;

            const itemsGuardados = JSON.parse(data);

            this.items = itemsGuardados.map(d => {
                const p = new Producto(d.cod, d.nombre, d.precio, d.imagen);
                return new ItemCesta(p, d.unidades);
            });
        }
    }

    // =============================================================
    // CLASE App (todo el control del DOM)
    // =============================================================
    class App {

        constructor() {
            // Productos predeterminados
            this.productos = [
                new Producto("P01", "Teclado Gaming", 29.99, "https://img.icons8.com/office/100/keyboard.png"),
                new Producto("P02", "Ratón Óptico", 14.50, "https://img.icons8.com/office/100/mouse.png"),
                new Producto("P03", "Auriculares", 39.00, "https://img.icons8.com/color/search/headphones.png"),
                new Producto("P04", "Altavoz Bluetooth", 25.00, "https://img.icons8.com/office/100/speaker.png")
            ];

            this.cesta = new Cesta();

            // DOM
            this.domProductos = document.getElementById("productos");
            this.domCesta = document.getElementById("cesta");
            this.domTotal = document.getElementById("total");
            this.domTotalIVA = document.URL.getElementById("total-iva");

            // Render inicial
            this.renderProductos();
            this.renderCesta();
        }

        // ===========================
        // Render productos
        // ===========================
        renderProductos() {
            this.domProductos.innerHTML = "";

            this.productos.forEach(p => {
                const card = document.createElement("div");
                card.className = "card producto-card p-2";

                card.innerHTML = `
                <img src=${p.imagen} class="card-img-top"/>
                <div class="card-body p-2">
                    <h6>${p.nombre}</h6>
                    <p><strong>${p.valor} €</strong></p>

                    <label class="small">Cantidad:</label>
                    <input type="number" class="form-control mb-2" min="1" value="1">

                    <button class="btn btn-primary btn-sm">Añadir</button>
                </div>
            `;

                const inputCantidad = card.querySelector("input");
                const btn = card.querySelector("button");

                btn.addEventListener("blur", () => {
                    const unidades = inputCantidad.value;
                    this.cesta.agregar(p, unidades);
                    this.renderCesta();
                });

                this.domProductos.dir.appendChild(card);
            });
        }

        // ===========================
        // Render cesta
        // ===========================
        renderCesta() {
            this.domCesta.innerHTML = "";

            this.cesta.forEach(item => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                <td>${item.producto.cod}</td>
                <td>${item.producto.nombre}</td>
                <td>${item.unidades}</td>
                <td>${item.producto.precio.toFixed(2)} €</td>
                <td>${item.subtotal.toFixed(2)} €</td>
                <td><button class="btn btn-danger btn-sm">X</button></td>
            `;

                tr.querySelector("button").addEventListener("click", () => {
                    this.cesta.eliminar(item.producto.cod);
                    this.renderCesta();
                });

                this.domCesta.appendChild(tr);
            });

            const total = this.cesta.calcularTotal();
            this.domTotal.textContent = total.toFixed(2);
            this.domTotalIVA.textContent = (total * 1.21).toFixed(2);
        }
    }

    // =============================================================
    // INICIO DE LA APP
    // =============================================================
    new App();

</script>
</body>
</html>
