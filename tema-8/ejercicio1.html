
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 Tema 8</title>
</head>
<body>

<h1>Buscador de fotografías</h1>

<p id="titulo"></p>

<img id="foto" alt="Fotografía">

<script>
    let id = Number(prompt("Introduce un número del 1 al 5000"));
    if (Number.isInteger(id) && id >= 1 && id <= 5000) {

        let xmlhttp = new XMLHttpRequest();
        xmlhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                let myObj = JSON.parse(this.responseText);
                document.getElementById("titulo").innerHTML = myObj.title;
                document.getElementById("foto").src = myObj.url;
            }
        };
        xmlhttp.open("GET", "https://jsonplaceholder.typicode.com/photos/" + id, true);
        xmlhttp.send();
    } else {
        alert("Debes introducir un número entero del 1 al 5000");
    }

</script>

</body>
</html>
